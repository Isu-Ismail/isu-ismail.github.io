<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Admin Login</title>
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <main class="login-box">
    <h1>Portfolio Admin</h1>
    <p class="muted">Sign in with the admin account created in Firebase Console → Authentication.</p>
    <div class="card">
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" />
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
        <div class="row end" style="margin-top:1.25rem">
          <button type="submit" class="primary" id="submit-btn">Sign In</button>
        </div>
        <p class="status" id="status"></p>
      </form>
    </div>
  </main>

  <script type="module">
    import { login } from "./js/auth.js";

    const form = document.getElementById("login-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusEl.textContent = "Signing in…";
      statusEl.className = "status";
      try {
        await login(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        location.href = "index.html";
      } catch (err) {
        statusEl.textContent = err.message || "Sign-in failed.";
        statusEl.className = "status err";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
